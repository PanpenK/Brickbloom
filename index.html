<body>
<style>
:root{
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-ui:"Fredoka","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif;
  --p-ink:#6b3f22;--p-sub:#a87652;--p-bg1:#fffbf2;--p-bg2:#ffe9c9;--p-edge:#eaa95f;--p-edge-d:#b8732f;
  --sky1:#5a4ad6;--sky2:#1d1858;--glow:rgba(160,140,255,.6);--frame:#7e8cff;--frame-d:#4550d0;--frame-lip:#262c8c;--well:#191b4d;--cell:#272a6a;--ol:#1a1450;
  --bg-art:none;--bg-size:auto;
  color-scheme:light;
}
html,body{height:100%}
body{
  background-color:var(--sky2);
  background-image:var(--bg-art),radial-gradient(130% 85% at 50% 40%,transparent 55%,rgba(40,10,40,.16)),radial-gradient(60% 40% at 50% 46%,rgba(255,255,255,.28),transparent 70%),radial-gradient(80% 45% at 50% -6%,var(--glow),transparent 72%),linear-gradient(180deg,var(--sky1),var(--sky2));
  background-size:var(--bg-size),100% 100%,100% 100%,100% 100%,100% 100%;
  color:#fff;font-family:var(--font-ui);font-weight:600;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
/* soft bokeh lights over every sky */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(140px 140px at 6% 16%,rgba(255,255,255,.22),transparent 70%),
    radial-gradient(200px 200px at 96% 30%,rgba(255,255,255,.16),transparent 70%),
    radial-gradient(160px 160px at 14% 78%,rgba(255,255,255,.14),transparent 70%),
    radial-gradient(240px 240px at 88% 92%,rgba(255,255,255,.12),transparent 70%)}
.app{position:relative;box-sizing:border-box;height:100%;max-width:480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.screen{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6dvh,14px)}
#scrGame{justify-content:center;gap:clamp(10px,2.2dvh,20px)}
.col{width:min(100%,max(240px,calc(100vh - 318px)));width:min(100%,max(240px,calc(100dvh - 318px)))}

/* ---------- Outlined game text ---------- */
.ot{color:#fff;--ow:2px;text-shadow:
  var(--ow) 0 0 var(--ol),calc(var(--ow)*-1) 0 0 var(--ol),0 var(--ow) 0 var(--ol),0 calc(var(--ow)*-1) 0 var(--ol),
  calc(var(--ow)*.75) calc(var(--ow)*.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*.75) 0 var(--ol),
  calc(var(--ow)*.75) calc(var(--ow)*-.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*-.75) 0 var(--ol),
  0 calc(var(--ow)*2) 0 var(--ol),var(--ow) calc(var(--ow)*2) 0 var(--ol),calc(var(--ow)*-1) calc(var(--ow)*2) 0 var(--ol),
  0 calc(var(--ow)*3) 6px rgba(0,0,0,.25)}
.ot.lg{--ow:3px}
.ot.xl{--ow:4px}

/* ---------- 3D candy buttons ---------- */
.gbtn{--b1:#8aea62;--b2:#45bb34;--b3:#2b8a20;--ol:#2a7a1e;
  position:relative;isolation:isolate;border:0;margin:0;cursor:pointer;border-radius:20px;padding:0 26px;height:58px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font:400 25px/1 var(--font-display);letter-spacing:.4px;color:#fff;
  background:linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 6px 0 var(--b3),0 12px 18px rgba(0,0,0,.22);
  transition:transform .07s ease-out,box-shadow .07s ease-out}
.gbtn::before{content:"";position:absolute;z-index:-1;left:7px;right:7px;top:4px;height:42%;border-radius:15px 15px 40% 40%/15px 15px 26% 26%;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.08))}
.gbtn:active{transform:translateY(5px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 var(--b3),0 3px 6px rgba(0,0,0,.22)}
.gbtn:focus-visible,.ibtn:focus-visible,.skin-card:focus-visible{outline:3px solid #fff;outline-offset:4px}
.gbtn.orange{--b1:#ffc65e;--b2:#ff8f1f;--b3:#c25e0a;--ol:#b0520a}
.gbtn.blue{--b1:#74d4ff;--b2:#2f8ff0;--b3:#1b5eb3;--ol:#1a55a1}
.gbtn.pink{--b1:#ffa2cf;--b2:#f2559b;--b3:#b02f6a;--ol:#a12a60}
.gbtn.purple{--b1:#c7a1ff;--b2:#8a5cf0;--b3:#5a34b3;--ol:#4f2fa3}
.gbtn.red{--b1:#ff8a8a;--b2:#e64545;--b3:#a62626;--ol:#962222}
.gbtn.cream{--b1:#fffaf0;--b2:#ffe8c8;--b3:#d8b585;color:var(--p-ink)}
.gbtn.cream::before{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.2))}
.gbtn.cream span{text-shadow:0 2px 0 rgba(255,255,255,.8)}
.gbtn.sm{height:48px;font-size:21px;border-radius:16px;padding:0 20px}
.gbtn.wide{width:100%}
.gbtn svg{width:26px;height:26px;flex:none;filter:drop-shadow(0 2px 0 var(--ol))}

/* round icon button */
.ibtn{--b1:#74d4ff;--b2:#2f8ff0;--b3:#1b5eb3;--ol:#1a55a1;
  position:relative;isolation:isolate;flex:none;width:48px;height:48px;border:0;margin:0;padding:0;border-radius:16px;cursor:pointer;color:#fff;
  display:grid;place-items:center;background:linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 var(--b3),0 9px 14px rgba(0,0,0,.2);
  transition:transform .07s ease-out,box-shadow .07s ease-out}
.ibtn::before{content:"";position:absolute;z-index:-1;left:5px;right:5px;top:3px;height:42%;border-radius:12px 12px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.06))}
.ibtn:active{transform:translateY(4px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 var(--b3),0 3px 6px rgba(0,0,0,.2)}
.ibtn svg{width:24px;height:24px;filter:drop-shadow(0 2px 0 var(--ol))}
.ibtn.pink{--b1:#ffa2cf;--b2:#f2559b;--b3:#b02f6a;--ol:#a12a60}
.ibtn.orange{--b1:#ffc65e;--b2:#ff8f1f;--b3:#c25e0a;--ol:#b0520a}
.spacer{width:48px;flex:none}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 4px;border-radius:99px;
  background:rgba(30,12,50,.32);box-shadow:inset 0 2px 5px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.35);
  font:400 19px/1 var(--font-display);font-variant-numeric:tabular-nums;--ol:rgba(30,12,50,.6)}
.pill .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 35%,#fff3a8,#ffc21f 60%,#e08a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.2)}
.pill .ico svg{width:18px;height:18px}
.pill .ico.pinkc{background:radial-gradient(circle at 40% 35%,#ffd0e6,#ff6fae 60%,#d63a80)}

.pill.cream{background:linear-gradient(180deg,#fffbf2,#fff0d6);color:#7a4a10;box-shadow:0 0 0 2px #f0d9a8,0 3px 0 #d9b98c,0 6px 10px rgba(0,0,0,.12)}
.pill .mini{font:700 10px/1 var(--font-ui);letter-spacing:.12em;color:#b08050;margin-right:-2px}
/* cream panel with ribbon */
.panel{position:relative;background:linear-gradient(180deg,var(--p-bg1),var(--p-bg2));border-radius:26px;color:var(--p-ink);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.9),inset 0 -6px 0 rgba(184,115,47,.16),0 0 0 3px var(--p-edge),0 7px 0 3px var(--p-edge-d),0 16px 26px rgba(0,0,0,.25)}
.ribbon{--rb1:#ff93bd;--rb2:#ea4f8c;--rb3:#b3306a;--rt:#c93a73;--ol:#9e2459;
  position:absolute;left:50%;top:0;transform:translate(-50%,-56%);z-index:2;min-width:70%;max-width:104%;height:54px;padding:0 26px;box-sizing:border-box;
  display:grid;place-items:center;white-space:nowrap;font:400 27px/1 var(--font-display);
  background:linear-gradient(180deg,var(--rb1),var(--rb2));border-radius:12px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.14),0 5px 0 var(--rb3),0 10px 14px rgba(0,0,0,.18)}
.ribbon::before,.ribbon::after{content:"";position:absolute;z-index:-1;top:16px;width:30px;height:44px;background:var(--rt)}
.ribbon::before{left:-28px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,34% 50%)}
.ribbon::after{right:-28px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,66% 50%);transform:scaleX(-1)}
.ribbon.green{--rb1:#9cef72;--rb2:#46bb36;--rb3:#2b8a20;--rt:#36a02a;--ol:#26781c}
.ribbon.blue{--rb1:#7dd8ff;--rb2:#3192f0;--rb3:#1b5eb3;--rt:#2477d6;--ol:#1a55a1}
.ribbon.red{--rb1:#ff9090;--rb2:#e64545;--rb3:#a62626;--rt:#c73636;--ol:#962222}
.ribbon.purple{--rb1:#c9a5ff;--rb2:#8a5cf0;--rb3:#5a34b3;--rt:#7448d8;--ol:#4f2fa3}
.ribbon.gold{--rb1:#ffe27a;--rb2:#ffad1f;--rb3:#c27508;--rt:#e08f10;--ol:#a35e05}
.ribbon > span{position:relative;top:-1px}

/* ---------- Home ---------- */
.home{justify-content:space-between;padding-bottom:4px}
.home-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.decor{position:absolute;inset:0;pointer-events:none;z-index:0}
.float-piece{position:absolute;animation:bob 4.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.float-piece .piece{transform:rotate(var(--rot))}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
.logo{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;margin-top:auto}
.tiles{display:flex;gap:5px}
.tiles .blk{width:clamp(48px,14vw,62px);aspect-ratio:1;display:grid;place-items:center}
.tiles .blk:nth-child(odd){transform:rotate(-6deg) translateY(3px)}
.tiles .blk:nth-child(even){transform:rotate(5deg)}
.tiles b{position:relative;z-index:5;font:400 clamp(32px,9.4vw,42px)/1 var(--font-display)}
.tiles .blk{animation:hop 3.6s ease-in-out infinite}
.tiles .blk:nth-child(2){animation-delay:.12s}.tiles .blk:nth-child(3){animation-delay:.24s}.tiles .blk:nth-child(4){animation-delay:.36s}.tiles .blk:nth-child(5){animation-delay:.48s}
@keyframes hop{0%,70%,100%{translate:0 0}78%{translate:0 -10px}86%{translate:0 0}}
.wordmark{position:relative;margin-top:-6px;font:400 clamp(70px,22vw,98px)/1 var(--font-display);letter-spacing:1px}
.wordmark span{position:relative;z-index:1;color:transparent;background:linear-gradient(180deg,#fffbd0 8%,#ffe066 40%,#ffb627 72%,#ff8a1f 100%);-webkit-background-clip:text;background-clip:text}
.wordmark::before{content:attr(data-text);position:absolute;inset:0;z-index:0;color:#c2531f;--ol:#8a3210;--ow:5px;
  text-shadow:var(--ow) 0 0 var(--ol),calc(var(--ow)*-1) 0 0 var(--ol),0 var(--ow) 0 var(--ol),0 calc(var(--ow)*-1) 0 var(--ol),
  calc(var(--ow)*.75) calc(var(--ow)*.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*.75) 0 var(--ol),calc(var(--ow)*.75) calc(var(--ow)*-.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*-.75) 0 var(--ol),
  0 8px 0 var(--ol),5px 8px 0 var(--ol),-5px 8px 0 var(--ol),0 14px 18px rgba(0,0,0,.28)}
.tagline{margin-top:6px;font-size:15px;--ol:var(--ol)}
.menu{position:relative;z-index:1;width:min(100%,340px);display:flex;flex-direction:column;gap:18px;margin-top:auto;margin-bottom:auto}
.mode{height:84px;width:100%;justify-content:flex-start;padding:0 16px;gap:14px;border-radius:26px}
.mode::before{border-radius:20px 20px 40% 40%/20px 20px 26% 26%}
.mode-ico{width:56px;height:56px;flex:none;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.22);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.08)}
.mode-ico svg{width:34px;height:34px}
.mode-txt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.mode-t{font-size:31px}
.mode-s{font:700 13px/1 var(--font-ui);padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.18);text-shadow:none;letter-spacing:.2px}
.style-btn{height:70px}
.style-btn .mode-ico{width:48px;height:48px}
.style-btn .mode-t{font-size:26px}
.style-btn .sw{display:grid;grid-template-columns:repeat(2,17px);gap:3px}
.style-btn .sw .blk{width:17px;height:17px}
.foot{position:relative;z-index:1;margin:0;padding:6px 14px;border-radius:99px;background:rgba(30,12,50,.28);font-size:12px;font-weight:600;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}

/* ---------- Common top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
.topbar .title{flex:1;text-align:center;font:400 28px/1 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 0 10px}

/* ---------- Styles picker ---------- */
.style-grid{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;padding:8px 6px 26px;align-content:start;box-sizing:border-box}
.skin-card{position:relative;border:0;margin:0;padding:9px 9px 10px;border-radius:22px;cursor:pointer;font:inherit;color:#fff;
  background-color:var(--sky2);background-image:var(--bg-art),radial-gradient(90% 60% at 50% -10%,var(--glow),transparent 70%),linear-gradient(180deg,var(--sky1),var(--sky2));
  background-size:var(--bg-size),100% 100%,100% 100%;display:flex;flex-direction:column;gap:8px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 0 3px rgba(255,255,255,.9),0 7px 0 3px rgba(0,0,0,.12),0 12px 18px rgba(0,0,0,.18);transition:transform .1s}
.skin-card:active{transform:scale(.97)}
.skin-card.on{box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 0 4px #ffd84a,0 0 0 7px #e5901a,0 8px 0 5px rgba(0,0,0,.14),0 0 26px 8px rgba(255,214,74,.55)}
.skin-frame{padding:5px;border-radius:15px;background:linear-gradient(180deg,var(--frame),var(--frame-d));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 var(--frame-lip)}
.skin-board{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px;border-radius:11px;background:var(--well);box-shadow:inset 0 2px 4px rgba(0,0,0,.16)}
.skin-board .cell{aspect-ratio:1}
.skin-name{font:400 19px/1.1 var(--font-display);text-align:center;padding-top:2px}
.skin-check{position:absolute;top:-9px;right:-9px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;z-index:3;
  background:linear-gradient(180deg,#8aea62,#3fae30);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #2b8a20,0 0 0 3px #fff}
.skin-check svg{width:18px;height:18px;filter:drop-shadow(0 1px 0 #2a7a1e)}
.skin-card:not(.on) .skin-check{display:none}
.grid-head{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 4px 0}
.grid-head span{font:400 24px/1 var(--font-display)}
.grid-head small{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(30,12,50,.28)}
.new-tag{position:absolute;top:-8px;left:-6px;z-index:3;padding:4px 8px;border-radius:9px;font:400 12px/1 var(--font-display);color:#fff;letter-spacing:.06em;
  background:linear-gradient(180deg,#ff8a8a,#e64545);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 #a62626,0 0 0 2px #fff;rotate:-8deg}

/* effects */
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:6}
.pt{position:absolute;border-radius:28%;pointer-events:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.5)}
.sweep{position:absolute;border-radius:10px;pointer-events:none;mix-blend-mode:screen}
.sweep.h{background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 30% 70%,transparent);animation:sweepH .5s ease-out forwards;box-shadow:0 0 18px 6px rgba(255,255,255,.55)}
.sweep.v{background:linear-gradient(180deg,transparent,rgba(255,255,255,.95) 30% 70%,transparent);animation:sweepV .5s ease-out forwards;box-shadow:0 0 18px 6px rgba(255,255,255,.55)}
@keyframes sweepH{0%{transform:scaleX(.05);opacity:1}60%{opacity:.9}100%{transform:scaleX(1.15) scaleY(.4);opacity:0}}
@keyframes sweepV{0%{transform:scaleY(.05);opacity:1}60%{opacity:.9}100%{transform:scaleY(1.15) scaleX(.4);opacity:0}}
.pop-score{position:absolute;transform:translate(-50%,-50%);font:400 30px/1 var(--font-display);--ol:#a35e05;color:#ffe46b;white-space:nowrap;animation:rise 1s ease-out forwards}
@keyframes rise{0%{opacity:0;scale:.4}18%{opacity:1;scale:1.25}32%{scale:1}100%{opacity:0;translate:0 -54px}}
.banner{position:absolute;left:50%;top:44%;translate:-50% -50%;white-space:nowrap;padding:22px 44px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,10,30,.22),transparent);font:400 clamp(40px,11.5vw,54px)/1 var(--font-display);animation:bannerIn 1.35s cubic-bezier(.3,1.4,.5,1) forwards;color:#ffe46b;--ol:#8a3d00}
.banner.sub{top:60%;font-size:clamp(26px,7.5vw,34px)}
.banner.sub{color:#fff;--ol:#1a55a1;background:none}
.banner.green{color:#f0ffd8;--ol:#2b6a12}
@keyframes bannerIn{0%{opacity:0;scale:.2;rotate:-8deg}16%{opacity:1;scale:1.18;rotate:3deg}28%{scale:1;rotate:0deg}78%{opacity:1;translate:-50% -50%}100%{opacity:0;translate:-50% -90%}}
.conf{position:absolute;top:-4%;width:10px;height:14px;border-radius:3px;animation:fall var(--t,1.6s) cubic-bezier(.3,.4,.6,1) var(--dl,0s) forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx,0),108vh) rotate(var(--rot,540deg))}}
/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;box-sizing:border-box;overflow:hidden;
  background:rgba(28,12,48,.66);animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.rays{position:absolute;left:50%;top:46%;width:1000px;height:1000px;margin:-500px 0 0 -500px;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,236,160,.22) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0 18%,transparent 52%);mask:radial-gradient(circle,#000 0 18%,transparent 52%);animation:spin 22s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.mpanel{position:relative;width:min(340px,100%);padding:50px 20px 24px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.mpanel .lbl{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--p-sub)}
.mpanel .big{font:400 58px/1 var(--font-display);color:var(--p-ink);font-variant-numeric:tabular-nums}
.mpanel .sm{font:400 26px/1 var(--font-display);color:#e0890f;font-variant-numeric:tabular-nums}
.mpanel p{margin:0;color:var(--p-sub);font-weight:600;font-size:15px;text-wrap:balance}
.mpanel .goal-panel{background:rgba(184,115,47,.12);box-shadow:inset 0 2px 4px rgba(120,70,30,.15)}
.mbtns{display:flex;flex-direction:column;align-items:stretch;gap:16px;width:100%;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:6px 14px;border-radius:99px;background:linear-gradient(180deg,#ffe27a,#ffad1f);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 #c27508;font:400 17px/1 var(--font-display);--ol:#a35e05;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{rotate:-3deg}50%{rotate:3deg}}
.stars3{display:flex;align-items:flex-end;gap:2px;margin-top:-2px}
.stars3 svg{width:62px;height:62px;filter:drop-shadow(0 4px 0 #c27508) drop-shadow(0 0 10px rgba(255,210,60,.6));animation:starpop .55s cubic-bezier(.3,1.8,.5,1) both}
.stars3 svg:nth-child(1){animation-delay:.35s;rotate:-12deg}
.stars3 svg:nth-child(2){width:80px;height:80px;margin-bottom:10px;animation-delay:.6s}
.stars3 svg:nth-child(3){animation-delay:.85s;rotate:12deg}
@keyframes starpop{0%{scale:.2;opacity:0}70%{scale:1.25;opacity:1}100%{scale:1}}
.mpanel .corners{display:flex;justify-content:center;gap:12px;margin:-6px 0 2px}
.mpanel .corner{width:40px;height:40px;border-radius:13px}
.mpanel .corner svg{width:21px;height:21px}
.mpanel .corner svg{width:22px;height:22px}
.mpanel.wide-ribbon .ribbon{min-width:104%}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
/*SKINS-START*/
/* ===== Skin engine v2 ===================================================
   Each block holds <i class="sk">. The block sets --c (--k1..--k9; 9 = stone)
   and data-k. Blocks are size containers, so decoration uses cqw units.
   Every style also sets its scene: --sky1/--sky2/--glow (background),
   --frame/--frame-d/--frame-lip (board frame), --well/--cell (board inside),
   --ol (outline colour for white game text on that background).
   ====================================================================== */
.cell,.blk{position:relative;container-type:size}
.sk{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  --l1:color-mix(in srgb,var(--c),#fff 24%);
  --l2:color-mix(in srgb,var(--c),#fff 50%);
  --l3:color-mix(in srgb,var(--c),#fff 74%);
  --d1:color-mix(in srgb,var(--c),#000 9%);
  --d2:color-mix(in srgb,var(--c),#000 20%);
  --d3:color-mix(in srgb,var(--c),#000 34%);
  --ob:color-mix(in srgb,var(--c),#2b1236 46%);
  --gloss:radial-gradient(74% 40% at 50% 7%,rgba(255,255,255,.82),rgba(255,255,255,0) 76%);
}
.cell:not(.f):not(.w):not(.g) .sk{display:none}
.cell.f,.cell.w{background:transparent!important;box-shadow:none!important}
.cell.g .sk{opacity:.5}
.cell .gs,.blk .gs{z-index:3}
.cell.w::before{z-index:2}
.cell.pop::after{z-index:4}
.cell.land .sk{animation:land .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{0%{scale:1.18 .82}50%{scale:.94 1.07}100%{scale:1 1}}
.tiny .sk::before,.tiny .sk::after{display:none!important}
.tiny .sk{inset:0!important;transform:none!important}
/* clean face-free tiles for the logo */
.plain .sk{inset:0!important;border-radius:26%!important;transform:none!important;filter:none!important;
  background:var(--gloss),linear-gradient(180deg,var(--l1),var(--c) 50%,var(--d2))!important;
  box-shadow:inset 0 -7cqw 3cqw var(--d2),inset 0 3cqw 0 rgba(255,255,255,.4),0 0 0 3cqw var(--ob),0 6cqw 6cqw rgba(0,0,0,.25)!important}
.plain .sk::before,.plain .sk::after{display:none!important}

/* ---------- Arcade ---------- */
[data-skin="classic"],[data-bg="classic"]{
  --sky1:#5a4ad6;--sky2:#1d1858;--glow:rgba(160,140,255,.6);--frame:#7e8cff;--frame-d:#4550d0;--frame-lip:#262c8c;--well:#191b4d;--cell:#272a6a;--ol:#1a1450;
  --k1:#ff4f5e;--k2:#ff9a2e;--k3:#ffd12e;--k4:#2fd58f;--k5:#2ec4f2;--k6:#4d7cff;--k7:#a35cff;--k8:#ff5fb8;--k9:#6d7299;
  --bg-art:radial-gradient(circle,rgba(255,255,255,.07) 0 2px,transparent 2.5px);--bg-size:26px 26px;--face:#2a1a3a;
}
[data-skin="classic"] .cell{border-radius:20%}
[data-skin="classic"] .sk{border-radius:22%;
  background:var(--gloss),linear-gradient(180deg,var(--l1),var(--c) 48%,var(--d2));
  box-shadow:inset 0 -6cqw 4cqw var(--d2),inset 0 0 0 2cqw rgba(255,255,255,.14),0 0 0 2.4cqw var(--ob),0 4cqw 3cqw rgba(0,0,0,.35)}
[data-skin="classic"] [data-k="9"] .sk{background:radial-gradient(70% 36% at 50% 8%,rgba(255,255,255,.25),transparent 75%),linear-gradient(180deg,#7d82a8,#6d7299 50%,#555a80)}

/* ---------- Gummy ---------- */
[data-skin="gummy"],[data-bg="gummy"]{
  --sky1:#ffd6ef;--sky2:#ff9fd1;--glow:rgba(255,255,255,.75);--frame:#ff86c8;--frame-d:#e8479b;--frame-lip:#ad2a70;--well:#fff2f9;--cell:#ffdcef;--ol:#a3246a;
  --k1:#ff3f5a;--k2:#ff8c3c;--k3:#ffc824;--k4:#6ed645;--k5:#22c9b5;--k6:#4a93ff;--k7:#9a63ff;--k8:#ff5fae;--k9:#8d7a8c;
  --bg-art:radial-gradient(circle,rgba(255,255,255,.18) 0 4px,transparent 4.5px);--bg-size:30px 30px;
}
[data-skin="gummy"] .cell{border-radius:36%}
[data-skin="gummy"] .sk{border-radius:36%;
  background:
    radial-gradient(90% 60% at 50% 108%,color-mix(in srgb,var(--c),#000 26%) 0%,transparent 70%),
    linear-gradient(165deg,color-mix(in srgb,var(--l2) 92%,transparent) 0%,color-mix(in srgb,var(--c) 90%,transparent) 46%,color-mix(in srgb,var(--d1) 95%,transparent) 100%);
  box-shadow:inset 0 0 0 3.5cqw color-mix(in srgb,var(--l2) 70%,transparent),inset 0 -9cqw 12cqw color-mix(in srgb,var(--c),#000 22%),0 0 0 2.2cqw var(--ob),0 5cqw 6cqw color-mix(in srgb,var(--c),transparent 55%)}
[data-skin="gummy"] .sk::before{content:"";position:absolute;left:16%;top:10%;width:48%;height:22%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.18));transform:rotate(-14deg)}
[data-skin="gummy"] .sk::after{content:"";position:absolute;right:16%;bottom:16%;width:13%;height:13%;border-radius:50%;background:rgba(255,255,255,.65)}
[data-skin="gummy"] [data-k="9"] .sk{background:
    radial-gradient(circle at 30% 36%,rgba(255,255,255,.35) 0 4%,transparent 5%),
    radial-gradient(circle at 64% 30%,rgba(255,255,255,.3) 0 3.5%,transparent 4.5%),
    radial-gradient(circle at 56% 66%,rgba(255,255,255,.3) 0 4%,transparent 5%),
    radial-gradient(circle at 30% 72%,rgba(255,255,255,.28) 0 3%,transparent 4%),
    linear-gradient(165deg,#a18fa0,#8d7a8c 55%,#74627a)}
[data-skin="gummy"] [data-k="9"] .sk::before,[data-skin="gummy"] [data-k="9"] .sk::after{display:none}

/* ---------- Kawaii ---------- */
[data-skin="kawaii"],[data-bg="kawaii"]{
  --sky1:#ffe3d3;--sky2:#ffb3c6;--glow:rgba(255,255,255,.8);--frame:#ffa2c2;--frame-d:#f06b9a;--frame-lip:#c24a78;--well:#fff5f3;--cell:#ffe2e6;--ol:#c2416b;
  --k1:#ff8db4;--k2:#ffb069;--k3:#ffd955;--k4:#86df9a;--k5:#76c9ff;--k6:#9aa5ff;--k7:#c99aff;--k8:#ff7b6b;--k9:#b4a39a;
  --face:#43242a;
  --bg-art:radial-gradient(circle,rgba(255,255,255,.2) 0 5px,transparent 5.5px);--bg-size:34px 34px;
}
[data-skin="kawaii"] .cell{border-radius:30%}
[data-skin="kawaii"] .sk{border-radius:30%;--ob:color-mix(in srgb,var(--c),#43242a 42%);
  background:
    radial-gradient(circle at 37% 42%,#fff 0 2.6%,transparent 3.4%),
    radial-gradient(circle at 69% 42%,#fff 0 2.6%,transparent 3.4%),
    radial-gradient(circle at 34% 46%,var(--face) 0 6.5%,transparent 7.5%),
    radial-gradient(circle at 66% 46%,var(--face) 0 6.5%,transparent 7.5%),
    radial-gradient(12% 7.5% at 21% 61%,rgba(255,90,130,.6) 0 60%,transparent 100%),
    radial-gradient(12% 7.5% at 79% 61%,rgba(255,90,130,.6) 0 60%,transparent 100%),
    radial-gradient(60% 26% at 50% 6%,rgba(255,255,255,.7),rgba(255,255,255,0) 80%),
    linear-gradient(180deg,var(--l1),var(--c) 60%);
  box-shadow:inset 0 -7cqw 0 var(--d1),inset 0 3cqw 0 rgba(255,255,255,.6),0 0 0 2.2cqw var(--ob),0 4cqw 4cqw rgba(92,40,50,.22)}
[data-skin="kawaii"] .sk::after{content:"";position:absolute;left:43%;top:53%;width:14%;height:8%;
  border:3.4cqw solid var(--face);border-top:0;border-radius:0 0 99cqw 99cqw;box-sizing:border-box}
[data-skin="kawaii"] :is([data-k="2"],[data-k="5"],[data-k="8"]) .sk{
  background:
    radial-gradient(6% 5% at 50% 60%,#e0506e 0 98%,transparent 100%),
    radial-gradient(7.5% 6.5% at 50% 58%,var(--face) 0 98%,transparent 100%),
    radial-gradient(12% 7.5% at 21% 61%,rgba(255,90,130,.6) 0 60%,transparent 100%),
    radial-gradient(12% 7.5% at 79% 61%,rgba(255,90,130,.6) 0 60%,transparent 100%),
    radial-gradient(60% 26% at 50% 6%,rgba(255,255,255,.7),rgba(255,255,255,0) 80%),
    linear-gradient(180deg,var(--l1),var(--c) 60%)}
[data-skin="kawaii"] :is([data-k="2"],[data-k="5"],[data-k="8"]) .sk::before,
[data-skin="kawaii"] :is([data-k="2"],[data-k="5"],[data-k="8"]) .sk::after{
  content:"";position:absolute;top:39%;width:15%;height:9%;left:27%;
  border:3.4cqw solid var(--face);border-bottom:0;border-radius:99cqw 99cqw 0 0;box-sizing:border-box}
[data-skin="kawaii"] :is([data-k="2"],[data-k="5"],[data-k="8"]) .sk::after{left:58%}
[data-skin="kawaii"] :is([data-k="4"],[data-k="7"]) .sk{
  background:
    radial-gradient(12% 7.5% at 21% 61%,rgba(255,90,130,.6) 0 60%,transparent 100%),

/* Layout: one-screen mobile puzzle. Brand chrome shared with Blockbloom; an indigo toy-box board with brick gates on its rim. */
:root{
  --sky1:#5a46d8;--sky2:#1c1452;--glow:rgba(170,140,255,.6);--ol:#1c1250;

  --bg-art:radial-gradient(circle,rgba(255,255,255,.06) 0 2px,transparent 2.5px);--bg-size:26px 26px;
}
#scrGame{justify-content:flex-start;gap:clamp(8px,1.6dvh,14px)}
.hud{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;width:min(100%,440px)}
.hud-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.timer{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 8px;border-radius:16px;
  background:linear-gradient(180deg,#fffbf2,#ffeccc);color:var(--p-ink);box-shadow:0 0 0 2px #f0d9a8,0 4px 0 #d9b98c,0 8px 14px rgba(0,0,0,.18);
  font:400 26px/1 var(--font-display);font-variant-numeric:tabular-nums}
.timer svg{width:26px;height:26px}
.timer.low{color:#e03a3a;animation:tick 1s ease-in-out infinite}
@keyframes tick{50%{transform:scale(1.07)}}
.lvl-pill{font-size:13px;height:26px;padding:0 12px}

/* board */
.stage{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.bframe{position:relative;border-radius:22px;background:linear-gradient(180deg,var(--frame),var(--frame-d));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18),0 7px 0 var(--frame-lip),0 18px 30px rgba(0,0,0,.35)}
.bclip{position:absolute;overflow:hidden;border-radius:10px;background:var(--well);box-shadow:inset 0 3px 8px rgba(0,0,0,.4);touch-action:none}
.floor{position:absolute;border-radius:6px;background:var(--cell);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.18)}
.wall{position:absolute;background:var(--frame-d);box-shadow:none}
.gate{position:absolute;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--c),#fff 25%),var(--c) 55%,color-mix(in srgb,var(--c),#000 12%));

<script>
(() => {
/* ---------- palette ---------- */
const COLORS = [0,1,2,3,4,5,6,7];                     // colour slots; the chosen style paints them (--k1..--k8)
const kv = c => `var(--k${c+1})`;
let colorCache = {};
function realColor(c){ if (!colorCache[c]) colorCache[c] = getComputedStyle(document.getElementById('scrGame')).getPropertyValue(`--k${c+1}`).trim() || '#ff7ab0'; return colorCache[c]; }
const SKINS = [
  {id:'pic-treasure',name:'Pirate Treasure',group:'pic',isNew:1},{id:'pic-pirategear',name:'Pirate Gear',group:'pic',isNew:1},{id:'pic-voyage',name:'Voyage',group:'pic',isNew:1},{id:'pic-shipahoy',name:'Ship Ahoy',group:'pic',isNew:1},{id:'pic-crew',name:'Pirate Crew',group:'pic',isNew:1},{id:'pic-island',name:'Island Friends',group:'pic',isNew:1},{id:'pic-hunt',name:'Treasure Hunt',group:'pic',isNew:1},{id:'pic-pirates',name:'Pirate Party',group:'pic',isNew:1},{id:'pic-velvet',name:'Velvet Plush',group:'pic',isNew:1},{id:'pic-fur',name:'Fluffy Fur',group:'pic',isNew:1},{id:'pic-picnic',name:'Picnic Fleece',group:'pic',isNew:1},{id:'pic-charms',name:'Ceramic Charms',group:'pic',isNew:1},{id:'pic-knit',name:'Cozy Knit',group:'pic',isNew:1},{id:'pic-cotton',name:'Cotton Candy',group:'pic',isNew:1},{id:'pic-jelly',name:'Jelly Candy',group:'pic',isNew:1},{id:'pic-glaze',name:'Glazed Ceramic',group:'pic',isNew:1},{id:'pic-sweater',name:'Knit Sweater',group:'pic',isNew:1},{id:'pic-fluff',name:'Cotton Fluff',group:'pic',isNew:1},{id:'pic-felt',name:'Soft Felt',group:'pic',isNew:1},{id:'pic-ceramics',name:'Ceramic Collection',group:'pic',isNew:1},{id:'pic-knits',name:'Knit Collection',group:'pic',isNew:1},{id:'pic-clouds',name:'Cloud Candy',group:'pic',isNew:1},{id:'pic-animals',name:'Animal Pals',group:'pic'},{id:'pic-sweets',name:'Sweet Treats',group:'pic'},{id:'pic-fruits',name:'Fruit Buddies',group:'pic'},{id:'pic-sky',name:'Sky Friends',group:'pic'},{id:'pic-party',name:'Kawaii Party',group:'pic'},{id:'pic-grass',name:'Lush Grass',group:'pic'},{id:'pic-jade',name:'Crystal Jade',group:'pic'},{id:'pic-sugar',name:'Sugar Crystal',group:'pic'},{id:'pic-wood',name:'Woodland',group:'pic'},{id:'pic-gems',name:'Candy Gems',group:'pic'},{id:'pic-crackers',name:'Butter Crackers',group:'pic'},{id:'pic-toast',name:'Toasty',group:'pic'},{id:'pic-waffles',name:'Waffles',group:'pic'},{id:'pic-cookies',name:'Sprinkle Cookies',group:'pic'},{id:'pic-bakery',name:'Sweet Bakery',group:'pic'},
  {id:'kawaii',name:'Kawaii'},{id:'meadow',name:'Meadow'},{id:'gummy',name:'Gummy'},{id:'kitty',name:'Kitty'},
  {id:'jade',name:'Jade Glass'},{id:'macaron',name:'Macaron'},{id:'toast',name:'Toast'},{id:'mochi',name:'Mochi'},
  {id:'sticker',name:'Stickers'},{id:'cracker',name:'Crackers'},{id:'plush',name:'Plushie Pals'},{id:'blossom',name:'Blossom'},
  {id:'sugar',name:'Sugar Stone'},{id:'cookie',name:'Sugar Cookie'},{id:'clay',name:'Clay Critters'},{id:'wood',name:'Painted Wood'},
  {id:'bricks',name:'Toy Bricks'},{id:'soda',name:'Bubble Soda'},{id:'pearl',name:'Jelly Pearls'},{id:'star',name:'Starlight'},
  {id:'pixel',name:'Pixel Pals'},{id:'classic',name:'Arcade'}
];
const K_SKIN='brickbloom:skin';
let skin = (()=>{ try{ return localStorage.getItem(K_SKIN); }catch(e){ return null; } })();
if (!SKINS.some(x=>x.id===skin)) skin='pic-animals';
// Bricks that look alike count as the same colour: picture styles with 4 tiles repeat them across the 8 slots.
let same = [0,1,2,3,4,5,6,7];
function applySkin(){
  document.body.dataset.bg=skin; for (const id of ['scrHome','scrGame']) document.getElementById(id).dataset.skin=skin; colorCache={};
  const cs=getComputedStyle(document.getElementById('scrGame')), seen={};
  same = COLORS.map(c=>{ const v=(cs.getPropertyValue(`--k${c+1}`).trim()+'|'+cs.getPropertyValue(`--p${c+1}`).trim()+'|'+tileKey(c)); return seen[v]??(seen[v]=c); });
}
function tileKey(c){ const probe=document.createElement('div'); probe.className='blk'; probe.dataset.k=c+1; probe.hidden=true; const i=document.createElement('i'); i.className='sk'; probe.append(i); document.getElementById('scrGame').append(probe); const bg=getComputedStyle(i).backgroundImage; probe.remove(); return bg; }
const sameColor = (a,b) => same[a]===same[b];
const skEl = () => Object.assign(document.createElement('i'),{className:'sk'});
function tileEl(k, cls){ const b=document.createElement('div'); b.className='blk'+(cls?' '+cls:''); b.dataset.k=k; b.style.setProperty('--c',`var(--k${k})`); b.append(skEl()); return b; }
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const ICON_STAR = on => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="${on?'#ffd23f':'#c9b9a6'}" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const SVG_LOCK = '<svg viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="11" rx="3.2" fill="#ffc531" stroke="#8a5a00" stroke-width="1.4"/><path d="M8 10V8a4 4 0 0 1 8 0v2" fill="none" stroke="#8a5a00" stroke-width="2.6"/><circle cx="12" cy="15.2" r="1.8" fill="#8a5a00"/></svg>';
const SVG_KEY = '<svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="4.6" fill="#ffc531" stroke="#8a5a00" stroke-width="1.4"/><circle cx="8" cy="12" r="1.7" fill="#8a5a00"/><path d="M12.4 12H21M18 12v3M21 12v2.4" stroke="#8a5a00" stroke-width="2.2" stroke-linecap="round"/><path d="M12.4 12H21" stroke="#ffc531" stroke-width="1" stroke-linecap="round"/></svg>';
const SVG_H = '<svg viewBox="0 0 24 24"><path d="M3.5 12h17M3.5 12l4-4M3.5 12l4 4M20.5 12l-4-4M20.5 12l-4 4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_V = '<svg viewBox="0 0 24 24"><path d="M12 3.5v17M12 3.5l-4 4M12 3.5l4 4M12 20.5l-4-4M12 20.5l4-4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- seeded random ---------- */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pick = (R,a) => a[Math.floor(R()*a.length)];

/* ---------- shapes ---------- */
const SHAPES = [
  {c:[[0,0]], w:2},
  {c:[[0,0],[0,1]], w:3}, {c:[[0,0],[1,0]], w:3},
  {c:[[0,0],[0,1],[0,2]], w:2}, {c:[[0,0],[1,0],[2,0]], w:2},
  {c:[[0,0],[0,1],[1,0],[1,1]], w:2.4},
  {c:[[0,0],[1,0],[1,1]], w:1.2}, {c:[[0,1],[1,0],[1,1]], w:1.2}, {c:[[0,0],[0,1],[1,0]], w:1.2}, {c:[[0,0],[0,1],[1,1]], w:1.2},
  {c:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], w:.8}, {c:[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]], w:.8},
  {c:[[0,0],[1,0],[2,0],[2,1]], w:.7}, {c:[[0,0],[0,1],[0,2],[1,1]], w:.6},
  {c:[[0,0],[0,1],[0,2],[0,3]], w:1.4}, {c:[[0,0],[1,0],[2,0],[3,0]], w:1.4},
  {c:[[0,0],[0,1],[0,2],[0,3],[1,0],[1,1],[1,2],[1,3]], w:.5}, {c:[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[3,1]], w:.5},
  {c:[[0,1],[1,0],[1,1],[1,2],[2,1]], w:.4}, {c:[[0,0],[0,1],[0,2],[1,0],[2,0]], w:.4},
];
const ext = cells => ({h:Math.max(...cells.map(x=>x[0]))+1, w:Math.max(...cells.map(x=>x[1]))+1});

/* ---------- board logic ---------- */
// level: {W,H,walls:Set(idx), gates:[{side,s,len,color}], bricks:[{id,color,cells,r,c,axis,ice,lock,key}]}
function occGrid(L, bricks, skipId){
  const g = new Int16Array(L.W*L.H).fill(-1);
  for (const i of L.walls) g[i] = -2;
  for (const b of bricks) if (b.id!==skipId && !b.gone) for (const [dr,dc] of b.cells) g[(b.r+dr)*L.W+(b.c+dc)] = b.id;
  return g;
}
function fitsAt(L, g, b, r, c){
  for (const [dr,dc] of b.cells){ const rr=r+dr, cc=c+dc; if (rr<0||cc<0||rr>=L.H||cc>=L.W) return false; if (g[rr*L.W+cc]!==-1) return false; }
  return true;
}
function exitGate(L, b, r, c){
  const e = ext(b.cells);
  for (const gt of L.gates){
    if (!sameColor(gt.color, b.color)) continue;
    if ((b.axis==='h' && (gt.side==='T'||gt.side==='B')) || (b.axis==='v' && (gt.side==='L'||gt.side==='R'))) continue;
    if (gt.side==='R' && c+e.w===L.W && r>=gt.s && r+e.h<=gt.s+gt.len) return gt;
    if (gt.side==='L' && c===0 && r>=gt.s && r+e.h<=gt.s+gt.len) return gt;
    if (gt.side==='B' && r+e.h===L.H && c>=gt.s && c+e.w<=gt.s+gt.len) return gt;
    if (gt.side==='T' && r===0 && c>=gt.s && c+e.w<=gt.s+gt.len) return gt;
  }
  return null;
}
const movable = (b, locksOpen) => !b.gone && !(b.ice>0) && !(b.lock && !locksOpen);
// Bricks move like a slide puzzle: a swipe sends one all the way until something stops it.
const DIRS = {R:[0,1], L:[0,-1], B:[1,0], T:[-1,0]};
function dirsFor(b){ return b.axis==='h' ? ['R','L'] : b.axis==='v' ? ['B','T'] : ['R','L','B','T']; }
function slideEnd(L, g, b, r, c, dr, dc){ while (fitsAt(L,g,b,r+dr,c+dc)){ r+=dr; c+=dc; } return [r,c]; }
function exitAfterSlide(L, b, r, c, side){ const gt = exitGate(L,b,r,c); return gt && gt.side===side ? gt : null; }
function reach(L, bricks, b){            // every spot a brick can come to rest at, by swipes alone
  const g = occGrid(L, bricks, b.id), seen = new Set([b.r*64+b.c]), q=[[b.r,b.c]], out=[];
  while (q.length){
    const [r,c] = q.pop(); out.push([r,c]);
    for (const side of dirsFor(b)){ const [dr,dc]=DIRS[side]; const [nr,nc]=slideEnd(L,g,b,r,c,dr,dc); const k=nr*64+nc; if (!seen.has(k)){ seen.add(k); q.push([nr,nc]); } }
  }
  return out;
}
function canExit(L, bricks, b){           // can some chain of swipes carry it out through its gate?
  const g = occGrid(L, bricks, b.id);
  for (const [r,c] of reach(L, bricks, b)) for (const side of dirsFor(b)){ const [dr,dc]=DIRS[side]; const [er,ec]=slideEnd(L,g,b,r,c,dr,dc); if (exitAfterSlide(L,b,er,ec,side)) return true; }
  return false;
}
// greedy solver: keep exiting any brick that can reach its gate. Returns {ok, firstExitable}
function solve(L){
  const bricks = L.bricks.map(b=>({...b}));
  let locksOpen = !bricks.some(b=>b.key), left = bricks.length, first = -1, rounds = 0;
  while (left){
    let progressed = false, exitableNow = 0;
    for (const b of bricks){
      if (!movable(b, locksOpen)) continue;
      if (!canExit(L, bricks, b)) continue;
      exitableNow++;
      if (!progressed){
        b.gone = true; left--; progressed = true;
        for (const o of bricks) if (!o.gone && o.ice>0) o.ice--;
        if (b.key) locksOpen = true;
      }
    }
    if (rounds===0) first = exitableNow;
    rounds++;
    if (!progressed) return {ok:false, first};
  }
  return {ok:true, first};
}

/* ---------- level generator ---------- */
// Board outlines (1 = floor, 0 = hole), scaled to W x H: plain, U, H, L, T, plus and notched shapes
function maskFor(kind, W, H){
  const m = Array.from({length:H}, () => Array(W).fill(1));
  const cut = (r0,r1,c0,c1) => { for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++) if (r>=0&&c>=0&&r<H&&c<W) m[r][c]=0; };
  const midL = Math.floor(W/2)-1, midR = Math.ceil(W/2);
  if (kind==='U') cut(0, Math.floor(H*.55), midL, midR-1 + (W%2));
  if (kind==='H'){ cut(0, Math.floor(H*.3)-1, midL, midR-1+(W%2)); cut(H-Math.floor(H*.3), H-1, midL, midR-1+(W%2)); }
  if (kind==='L') cut(0, Math.floor(H*.45), W-3, W-1);
  if (kind==='J') cut(0, Math.floor(H*.45), 0, 2);
  if (kind==='T'){ cut(Math.floor(H*.55), H-1, 0, 1); cut(Math.floor(H*.55), H-1, W-2, W-1); }
  if (kind==='plus'){ cut(0,1,0,1); cut(0,1,W-2,W-1); cut(H-2,H-1,0,1); cut(H-2,H-1,W-2,W-1); }
  if (kind==='notch'){ cut(0,0,0,0); cut(0,0,W-1,W-1); cut(H-1,H-1,0,0); cut(H-1,H-1,W-1,W-1); cut(Math.floor(H/2)-1, Math.floor(H/2), 0, 0); cut(Math.floor(H/2)-1, Math.floor(H/2), W-1, W-1); }
  return m;
}
function genLevel(n){
  const d = n + 13;                                   // level 1 plays like the old level 14
  const tune = t => Math.min(1, (d-1)/t);
  const KINDS = ['rect','U','H','L','J','T','plus','notch'];
  for (let attempt=0; attempt<400; attempt++){
    const R = rng(n*9973 + attempt*7 + 11);
    const W = Math.min(8, 7 + Math.floor(R()*2)), H = Math.min(10, 9 + Math.floor(R()*2));
    const nc = Math.min(7, 4 + Math.floor(n/6) + Math.floor(R()*2));
    const relax = Math.floor(attempt/40);
    const fill = Math.max(.55, Math.min(.95, .86 + n*.003) - relax*.05);
    const kind = n===1 ? 'rect' : KINDS[(n*5 + Math.floor(R()*3)) % KINDS.length];
    const mask = maskFor(kind, W, H);
    const walls = new Set();
    for (let r=0;r<H;r++) for (let c=0;c<W;c++) if (!mask[r][c]) walls.add(r*W+c);
    if (R()<.35){ const r=2+Math.floor(R()*(H-4)), c=2+Math.floor(R()*(W-4)); if (!walls.has(r*W+c)) walls.add(r*W+c); }
    // gates: one per colour, a second for some
    const used = {L:[],R:[],T:[],B:[]}, gates=[];
    const colors = [...COLORS.keys()].sort(()=>R()-.5).slice(0,nc);
    const sides = ['L','R','T','B'];
    let bad=false;
    for (const col of colors){
      const count = R()<.3 ? 2 : 1;
      for (let k=0;k<count;k++){
        let placed=false;
        for (let t=0;t<40 && !placed;t++){
          const side = pick(R,sides), span = (side==='L'||side==='R') ? H : W;
          const len = Math.max(1, Math.min(span-1, 1 + Math.floor(R()*4)));
          const s0 = Math.floor(R()*(span-len+1));
          if (used[side].some(([a,b]) => s0 < b+1 && a < s0+len+1)) continue;
          let ok=true; for (let i=s0;i<s0+len;i++){ const idx = side==='L'? i*W : side==='R'? i*W+W-1 : side==='T'? i : (H-1)*W+i; if (walls.has(idx)) ok=false; }
          if (!ok) continue;
          used[side].push([s0,s0+len]); gates.push({side,s:s0,len,color:col}); placed=true;
        }
        if (!placed && k===0) bad=true;
      }
    }
    if (bad) continue;
    // bricks
    const L = {W,H,walls,gates,bricks:[]};
    const g = new Int16Array(W*H).fill(-1); for (const i of walls) g[i]=-2;
    const target = Math.round((W*H - walls.size)*fill);
    let filled=0, id=0, tries=0;
    const totalW = SHAPES.reduce((a,s)=>a+s.w,0);
    while (filled<target && tries++<3000){
      const col = pick(R,colors);
      const gs = gates.filter(x=>x.color===col);
      let x=R()*totalW, sh=SHAPES[0]; for (const s of SHAPES){ x-=s.w; if (x<=0){ sh=s; break; } }
      const e = ext(sh.c);
      if (!gs.some(gt => (gt.side==='L'||gt.side==='R') ? e.h<=gt.len : e.w<=gt.len)) continue;
      const r = Math.floor(R()*(H-e.h+1)), c = Math.floor(R()*(W-e.w+1));
      const b = {id, color:col, cells:sh.c, r, c, axis:null, ice:0, lock:false, key:false};
      if (!fitsAt(L,g,b,r,c)) continue;
      if (exitGate(L,b,r,c)) continue;           // no brick starts already on its gate
      if (R() < .14 + tune(60)*.12){ b.axis = e.w>e.h ? 'h' : e.h>e.w ? 'v' : (R()<.5?'h':'v'); }
      // built backwards: a brick may only go where it could reach its gate past the bricks already placed,
      // so clearing bricks in reverse placement order always works
      if (!canExit(L, L.bricks, b)){ if (b.axis){ b.axis=null; if (!canExit(L, L.bricks, b)) continue; } else continue; }
      for (const [dr,dc] of b.cells) g[(r+dr)*W+c+dc]=id;
      L.bricks.push(b); filled+=b.cells.length; id++;
    }
    // second pass: try every spot left for every shape, so boards come out packed
    { const order=[]; for (let r=0;r<H;r++) for (let c=0;c<W;c++) order.push([r,c]); order.sort(()=>R()-.5);
      const shapes = SHAPES.slice().sort((x,y)=>y.c.length-x.c.length || R()-.5);
      for (const sh of shapes){ const e=ext(sh.c);
        for (const [r,c] of order){
          if (filled >= target + 6) break;
          if (r+e.h>H || c+e.w>W) continue;
          for (const col of colors.slice().sort(()=>R()-.5)){
            const gs = gates.filter(x=>x.color===col);
            if (!gs.some(gt => (gt.side==='L'||gt.side==='R') ? e.h<=gt.len : e.w<=gt.len)) continue;
            const b = {id, color:col, cells:sh.c, r, c, axis:null, ice:0, lock:false, key:false};
            if (!fitsAt(L,g,b,r,c) || exitGate(L,b,r,c)) continue;
            if (!canExit(L, L.bricks, b)) continue;
            for (const [dr,dc] of b.cells) g[(r+dr)*W+c+dc]=id;
            L.bricks.push(b); filled+=b.cells.length; id++; break;
          }
        }
      }
    }
    if (L.bricks.length < 3) continue;
    const N = L.bricks.length;
    // ice: brick i is cleared after N-1-i others, so its count can be at most that
    { const k = 1 + Math.floor(R()*(2+tune(60)*2)); for (let t=0;t<k;t++){ const i = Math.floor(R()*Math.max(1,N-2)); const room = N-1-i; if (room>=1 && !L.bricks[i].ice) L.bricks[i].ice = Math.max(1, Math.min(room, 1 + Math.floor(R()*Math.min(4, 2+n/10)))); } }
    // lock and key: the key brick must be cleared first, so it is placed later than the lock
    if (N>=4 && (n===1 || R()<.85)){ const li = Math.floor(R()*(N-2)); const ki = li+1+Math.floor(R()*(N-1-li)); L.bricks[li].lock=true; L.bricks[ki].key=true; }
    const res = solve(L);
    if (!res.ok) continue;
    const maxFirst = Math.max(2, Math.ceil(L.bricks.length*(n<4 ? .6 : .34)));
    if (res.first > maxFirst && attempt < 300) continue;
    return L;
  }
  return null;
}
function timeFor(L){
  const specials = L.bricks.filter(b=>b.ice||b.axis||b.lock||b.key).length;
  return Math.ceil((25 + L.bricks.length*5 + specials*3)/5)*5;
}

/* ---------- level setup + rendering ---------- */
function startLevel(n){
  closeModal(overEl); closeModal(pauseEl);
  L = genLevel(n); L.n = n; L.locksOpen = !L.bricks.some(b=>b.key);
  timeMax = timeLeft = timeFor(L); done=false; paused=false; extraUsed=false; undoStack=[];
  $('lvlTxt').textContent = `LEVEL ${n}`;
  const hasIce=L.bricks.some(b=>b.ice), hasAxis=L.bricks.some(b=>b.axis), hasKey=L.bricks.some(b=>b.key);
  $('hint').textContent = n===1 ? 'Swipe a brick and it slides until it stops. Send each one out through its own color gate.'
    : (n===4 && hasIce) ? 'Ice bricks thaw a little each time another brick leaves.'
    : (n===8 && hasAxis) ? 'Arrow bricks only slide the way their arrows point.'
    : (n===12 && hasKey) ? 'The key brick opens every lock when it leaves.'
    : '';
  $('hint').style.visibility = $('hint').textContent ? 'visible' : 'hidden';
  show('game'); layout(); renderBoard(); renderBricks(false); updateTimer(); startClock();
}
function layout(){
  const r = stage.getBoundingClientRect();
  const availW = Math.min(r.width, 460), availH = Math.max(200, r.height - 18);
  S = Math.floor(Math.min((availW - 2*Math.max(16,availW*.06))/L.W, (availH - 2*Math.max(16,availW*.06))/L.H));
  S = Math.max(26, Math.min(64, S));
  PAD = Math.round(Math.max(16, S*.46));
  frame.style.width = (L.W*S + 2*PAD)+'px'; frame.style.height = (L.H*S + 2*PAD)+'px';
  clip.style.cssText = `left:${PAD}px;top:${PAD}px;width:${L.W*S}px;height:${L.H*S}px`;
}
function renderBoard(){
  clip.innerHTML=''; gateEls.forEach(g=>g.remove()); gateEls.length=0; brickEls.clear();
  const gap = Math.max(2, Math.round(S*.05));
  for (let r=0;r<L.H;r++) for (let c=0;c<L.W;c++){
    const d=document.createElement('div'); const wall=L.walls.has(r*L.W+c);
    d.className = wall ? 'wall' : 'floor board-cell';
    d.style.cssText = wall ? `left:${c*S-1}px;top:${r*S-1}px;width:${S+2}px;height:${S+2}px` : `left:${c*S+gap/2}px;top:${r*S+gap/2}px;width:${S-gap}px;height:${S-gap}px`;
    clip.append(d);
  }
  const th = Math.max(12, PAD-3);
  for (const gt of L.gates){
    const d=document.createElement('div'); d.className='gate '+gt.side; d.style.setProperty('--c',kv(gt.color));
    const inset=3;
    if (gt.side==='R') d.style.cssText+=`left:${PAD+L.W*S+2}px;top:${PAD+gt.s*S+inset}px;width:${th}px;height:${gt.len*S-2*inset}px`;
    if (gt.side==='L') d.style.cssText+=`left:${PAD-th-2}px;top:${PAD+gt.s*S+inset}px;width:${th}px;height:${gt.len*S-2*inset}px`;
    if (gt.side==='T') d.style.cssText+=`top:${PAD-th-2}px;left:${PAD+gt.s*S+inset}px;height:${th}px;width:${gt.len*S-2*inset}px`;
    if (gt.side==='B') d.style.cssText+=`top:${PAD+L.H*S+2}px;left:${PAD+gt.s*S+inset}px;height:${th}px;width:${gt.len*S-2*inset}px`;
    frame.append(d); gateEls.push(d); gt.el=d;
  }
}
function brickEl(b){
  const el=document.createElement('div'); el.className='brick'; el.dataset.id=b.id; el.style.setProperty('--c',kv(b.color));
  const set=new Set(b.cells.map(([r,c])=>r*16+c)), has=(r,c)=>set.has(r*16+c), rad=Math.round(S*.2)+'px';
  const inset = Math.max(2, Math.round(S*.07)), tile = S - 2*inset;
  for (const [r,c] of b.cells){
    const nt=!has(r-1,c), nb=!has(r+1,c), nl=!has(r,c-1), nr=!has(r,c+1);
    const p=document.createElement('div'); p.className='plate'+(nt?' nt':'')+(nb?' nb':'')+(nl?' nl':'')+(nr?' nr':'');
    const g=2;
    p.style.cssText=`left:${c*S+(nl?g:0)}px;top:${r*S+(nt?g:0)}px;width:${S-(nl?g:0)-(nr?g:0)}px;height:${S-(nt?g:0)-(nb?g:0)}px;`+
      `--rtl:${nt&&nl?rad:'0'};--rtr:${nt&&nr?rad:'0'};--rbr:${nb&&nr?rad:'0'};--rbl:${nb&&nl?rad:'0'}`;
    el.append(p);
  }
  for (const [r,c] of b.cells){
    const t=tileEl(b.color+1); t.style.cssText+=`;left:${c*S+inset}px;top:${r*S+inset}px;width:${tile}px;height:${tile}px`;
    el.append(t);
  }

  const e=ext(b.cells), mr=(e.h-1)/2, mc=(e.w-1)/2;
  const [br,bc] = b.cells.slice().sort((a,z)=>Math.hypot(a[0]-mr,a[1]-mc)-Math.hypot(z[0]-mr,z[1]-mc))[0];
  const badge=document.createElement('div'); badge.className='badge-on'; badge.style.cssText=`left:${bc*S}px;top:${br*S}px;width:${S}px;height:${S}px`;
  el.append(badge); el._badge=badge;

}
function decorate(b, el){
  el.querySelectorAll('.blk').forEach(c=>c.classList.toggle('ice', b.ice>0));
  el.classList.toggle('locked', !!(b.lock && !L.locksOpen));
  const bd=el._badge;
  if (b.ice>0) bd.innerHTML=`<span class="icen ot lg">${b.ice}</span>`;
  else if (b.lock && !L.locksOpen) bd.innerHTML=SVG_LOCK;
  else if (b.key) bd.innerHTML=SVG_KEY;
  else if (b.axis==='h') bd.innerHTML=SVG_H;
  else if (b.axis==='v') bd.innerHTML=SVG_V;
  else bd.innerHTML='';
}
function place(b, el, instant){
  if (instant){ el.style.transition='none'; }
  el.style.transform=`translate(${b.c*S}px,${b.r*S}px)`;
  if (instant){ void el.offsetWidth; el.style.transition=''; }
}
function renderBricks(instant){
  for (const b of L.bricks){
    let el=brickEls.get(b.id);
    if (b.gone){ if (el){ el.remove(); brickEls.delete(b.id); } continue; }
    if (!el){ el=brickEl(b); clip.append(el); brickEls.set(b.id, el); place(b, el, true); }
    else place(b, el, instant);
    decorate(b, el);
  }
}

/* ---------- clock ---------- */
function fmt(s){ s=Math.max(0,Math.ceil(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function updateTimer(){ $('timeTxt').textContent=fmt(timeLeft); $('timer').classList.toggle('low', timeLeft<=10 && !done); }
function startClock(){
  clearInterval(tickT);
  let last=performance.now();
  tickT=setInterval(()=>{
    const now=performance.now(), dt=(now-last)/1000; last=now;
    if (paused || done || screen!=='game' || document.hidden) return;
    timeLeft-=dt; updateTimer();
    if (timeLeft<=0){ timeLeft=0; updateTimer(); timeUp(); }
  },200);
}

/* ---------- sound + haptics ---------- */
let ac=null;
function tone(f,t,dur,type,vol){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02); }
function sfx(kind,n){
  if (!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if (ac.state==='suspended') ac.resume();
    const t=ac.currentTime;
    if (kind==='grab') tone(520,t,.05,'sine',.06);
    if (kind==='swish'){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(220,t+.12); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.14); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.16); }
    if (kind==='bump') tone(140,t,.08,'sine',.08);
    if (kind==='stop') tone(260,t,.04,'sine',.018);
    if (kind==='exit'){ const b=523.25*Math.pow(2,Math.min(n||0,10)/12); [0,4,7,12].forEach((s,k)=>tone(b*Math.pow(2,s/12),t+k*.05,.2,'triangle',.11)); }
    if (kind==='unlock'){ tone(880,t,.1,'sine',.08); tone(1320,t+.08,.18,'sine',.07); }
    if (kind==='win') [523.25,659.25,783.99,1046.5,1318.5].forEach((f,k)=>tone(f,t+k*.09,.35,'triangle',.12));
    if (kind==='over') [392,330,262,196].forEach((f,k)=>tone(f,t+k*.14,.3,'sine',.12));
  }catch(e){}
}
function buzz(p){ if (!hapticsOn) return; try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------- effects ---------- */
function burstAt(x,y,color,count){
  for (let i=0;i<count;i++){
    const d=document.createElement('div'); d.className='pt'; const s=S*(.22+Math.random()*.2);
    d.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px;background:${color}`;
    fxEl.append(d);
    const ang=Math.random()*Math.PI*2, dist=S*(1+Math.random()*1.8);
    const a=d.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist+S}px) rotate(${Math.random()*540}deg) scale(.3)`,opacity:0}],{duration:600+Math.random()*350,easing:'cubic-bezier(.2,.7,.4,1)'});
    a.onfinish=()=>d.remove();
  }
}
function banner(text){ const d=document.createElement('div'); d.className='banner ot xl'; d.textContent=text; fxEl.append(d); setTimeout(()=>d.remove(),1450); }
function confetti(host){
  const cols=COLORS.map(realColor); for (let k=0;k<44;k++){ const c=document.createElement('div'); c.className='conf'; c.style.left=(Math.random()*100)+'%'; c.style.background=cols[k%cols.length];
    c.style.setProperty('--dx',(Math.random()*120-60)+'px'); c.style.setProperty('--rot',(Math.random()*900-450)+'deg'); c.style.setProperty('--t',(1.6+Math.random()*1.4)+'s'); c.style.setProperty('--dl',(Math.random()*.5)+'s'); host.append(c); setTimeout(()=>c.remove(),3600); }
}

/* ---------- exiting ---------- */
let streak=0, streakT=null;
function doExit(b, gt){
  const el=brickEls.get(b.id); const e=ext(b.cells);
  b.gone=true; brickEls.delete(b.id);
  el.classList.remove('held'); el.classList.add('out');
  let tx=b.c*S, ty=b.r*S;
  if (gt.side==='R') tx=(L.W+0.2)*S; if (gt.side==='L') tx=-(e.w+0.2)*S; if (gt.side==='B') ty=(L.H+0.2)*S; if (gt.side==='T') ty=-(e.h+0.2)*S;
  el.style.transform=`translate(${tx}px,${ty}px)`;
  setTimeout(()=>el.remove(),260);
  // burst at the gate
  const gx = gt.side==='R' ? PAD+L.W*S : gt.side==='L' ? PAD : PAD+(b.c+e.w/2)*S;
  const gy = gt.side==='B' ? PAD+L.H*S : gt.side==='T' ? PAD : PAD+(b.r+e.h/2)*S;
  setTimeout(()=>burstAt(gx,gy,realColor(b.color), 6+b.cells.length*3),120);
  gt.el.classList.remove('flash'); void gt.el.offsetWidth; gt.el.classList.add('flash');
  streak++; clearTimeout(streakT); streakT=setTimeout(()=>streak=0,2200);
  sfx('exit', streak); buzz(streak>2?[14,40,14]:16);
  if (streak===3) banner('Great!'); else if (streak===5) banner('Amazing!'); else if (streak===7) banner('Unstoppable!');
  for (const o of L.bricks) if (!o.gone && o.ice>0) o.ice--;
  if (b.key && !L.locksOpen){ L.locksOpen=true; setTimeout(()=>{ sfx('unlock'); banner('Unlocked!'); },150); }
  renderBricks(false);
  if (L.bricks.every(x=>x.gone)) setTimeout(win, 450);
}

/* ---------- swiping ---------- */
let swipe=null, busy=false;
clip.addEventListener('pointerdown', e=>{
  if (done || paused || swipe || busy) return;
  const el=e.target.closest('.brick'); if (!el) return;
  const b=L.bricks[+el.dataset.id]; if (!b || b.gone) return;
  e.preventDefault();
  if (!movable(b, L.locksOpen)){ nudge(el); return; }
  swipe={b, el, x:e.clientX, y:e.clientY, pid:e.pointerId};
  el.classList.add('held');
  try{ clip.setPointerCapture(e.pointerId); }catch(err){}
});
function nudge(el){ el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge'); sfx('bump'); buzz(8); }
function release(){ if (swipe){ swipe.el.classList.remove('held'); swipe=null; } }
clip.addEventListener('pointermove', e=>{
  if (!swipe || e.pointerId!==swipe.pid) return;
  const dx=e.clientX-swipe.x, dy=e.clientY-swipe.y, need=Math.max(14, S*.28);
  if (Math.hypot(dx,dy) < need) return;
  const side = Math.abs(dx)>Math.abs(dy) ? (dx>0?'R':'L') : (dy>0?'B':'T');
  const {b, el} = swipe; release();
  slide(b, el, side);
});
function slide(b, el, side){
  if (!dirsFor(b).includes(side)){ nudge(el); return; }
  const g=occGrid(L, L.bricks, b.id), [dr,dc]=DIRS[side];
  const [er,ec]=slideEnd(L,g,b,b.r,b.c,dr,dc), dist=Math.abs(er-b.r)+Math.abs(ec-b.c);
  const gt=exitAfterSlide(L,b,er,ec,side);
  if (!dist && !gt){ nudge(el); return; }
  undoStack.push(snapshot());
  b.r=er; b.c=ec;
  const dur = dist ? Math.min(320, 70 + dist*45) : 0;
  busy=true;
  el.style.transition = `transform ${dur}ms cubic-bezier(.3,.85,.4,1)`;
  place(b, el, false);
  sfx('swish');
  setTimeout(()=>{
    el.style.transition='';
    busy=false;
    if (gt){ doExit(b, gt); return; }
    el.classList.remove('thud-h','thud-v'); void el.offsetWidth; el.classList.add(dc?'thud-h':'thud-v');
    sfx('bump'); buzz(10);
  }, dur);
}
clip.addEventListener('pointerup', e=>{ if (swipe && e.pointerId===swipe.pid) release(); });
clip.addEventListener('pointercancel', e=>{ if (swipe && e.pointerId===swipe.pid) release(); });
document.addEventListener('touchmove', e=>{ if (swipe) e.preventDefault(); }, {passive:false});

$('undoBtn').addEventListener('click', ()=>{ if (done || busy || !undoStack.length){ sfx('bump'); return; } restore(undoStack.pop()); sfx('grab'); });

/* ---------- modals ---------- */
function closeModal(el){ el.hidden=true; el.innerHTML=''; }
function showModal(el,o,actions){
  el.innerHTML=`${o.rays?'<div class="rays"></div>':''}<div class="panel mpanel${o.rays?' wide-ribbon':''}"><div class="ribbon ${o.color||''}"><span class="ot">${o.ribbon}</span></div>${o.corner||''}${o.body||''}<div class="mbtns">${
    o.buttons.map(b=>`<button class="gbtn ${b.color||''} ${b.small?'sm':''}" data-act="${b.act}" type="button"><span class="${b.color==='cream'?'':'ot'}">${b.label}</span></button>`).join('')}</div></div>`;
  el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>actions[b.dataset.act]()));
  el.hidden=false;
}
function openPause(){
  if (done) return; paused=true;
  const snd = soundOn ? '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>' : '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const hap = hapticsOn ? '<svg viewBox="0 0 24 24" fill="#fff"><rect x="8" y="3.5" width="8" height="17" rx="2.2"/><path d="M4.5 8.5l-1.5 1.8 1.5 1.7-1.5 1.8 1.5 1.7M19.5 8.5l1.5 1.8-1.5 1.7 1.5 1.8-1.5 1.7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg viewBox="0 0 24 24" fill="#fff"><rect x="8" y="3.5" width="8" height="17" rx="2.2"/><path d="M4 5l16 14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  showModal(pauseEl,{ribbon:'Paused',color:'blue',
    corner:`<div class="corners"><button class="ibtn ${hapticsOn?'':'orange'} corner" data-act="hap" type="button" aria-label="Vibration ${hapticsOn?'on':'off'}">${hap}</button><button class="ibtn ${soundOn?'':'orange'} corner" data-act="snd" type="button" aria-label="Sound ${soundOn?'on':'off'}">${snd}</button></div>`,
    body:`<p>Level ${L.n} · ${fmt(timeLeft)} left</p>`,
    buttons:[{label:'Resume',act:'resume'},{label:'Restart Level',act:'restart',color:'cream',small:true},{label:'Brick Styles',act:'styles',color:'cream',small:true},{label:'Home',act:'home',color:'cream',small:true}]},
    {resume:()=>{ closeModal(pauseEl); paused=false; },
     restart:()=>startLevel(L.n),
     styles:()=>{ closeModal(pauseEl); stylesReturn='game'; show('styles'); },
     home:()=>{ closeModal(pauseEl); show('home'); },
     snd:()=>{ soundOn=!soundOn; store.set(K_SND,soundOn?'1':'0'); openPause(); },
     hap:()=>{ hapticsOn=!hapticsOn; store.set(K_HAP,hapticsOn?'1':'0'); openPause(); buzz(15); }});
}
$('pauseBtn').addEventListener('click', openPause);
$('goPlay').addEventListener('click', ()=>startLevel(level));
$('goStyles').addEventListener('click', ()=>{ stylesReturn='home'; show('styles'); });
$('stylesBack').addEventListener('click', ()=>{ if (stylesReturn==='game' && L){ show('game'); renderBoard(); renderBricks(true); paused=false; } else show('home'); });

function win(){
  if (done) return; done=true; updateTimer();
  const frac = timeLeft/timeMax, got = frac>.5 ? 3 : frac>.25 ? 2 : 1;
  stars[L.n] = Math.max(stars[L.n]||0, got); store.set(K_STARS, JSON.stringify(stars));
  if (L.n>=level){ level=L.n+1; store.set(K_LVL,String(level)); }
  sfx('win'); buzz([15,40,15,40,30]);
  showModal(overEl,{rays:true,ribbon:'Level Complete!',color:'green',
    body:`<div class="stars3" aria-label="${got} of 3 stars">${ICON_STAR(got>=1)}${ICON_STAR(got>=2)}${ICON_STAR(got>=3)}</div><p>Cleared with ${fmt(timeLeft)} to spare</p>`,
    buttons:[{label:'Next Level',act:'next'},{label:'Home',act:'home',color:'cream',small:true}]},
    {next:()=>startLevel(L.n+1), home:()=>{ closeModal(overEl); show('home'); }});
  confetti(overEl);
}
function timeUp(){
  if (done) return; done=true; drag=null;
  sfx('over'); buzz([20,60,20]);
  const btns = extraUsed ? [{label:'Try Again',act:'retry'},{label:'Home',act:'home',color:'cream',small:true}]
                         : [{label:'+20 Seconds',act:'more'},{label:'Try Again',act:'retry',color:'cream',small:true},{label:'Home',act:'home',color:'cream',small:true}];
  showModal(overEl,{ribbon:'Out of Time',color:'red',body:`<p>${L.bricks.filter(b=>!b.gone).length} bricks still on the board.</p>`,buttons:btns},
    {more:()=>{ extraUsed=true; timeLeft=20; timeMax=Math.max(timeMax,20); done=false; closeModal(overEl); updateTimer(); },
     retry:()=>startLevel(L.n), home:()=>{ closeModal(overEl); show('home'); }});
}

let rT=null;
window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if (screen==='game' && L){ layout(); renderBoard(); renderBricks(true); } },150); });
document.addEventListener('visibilitychange',()=>{ if (document.hidden && screen==='game' && !done && overEl.hidden) openPause(); });

window.__bb = {genLevel, solve, get L(){return L;}, startLevel, get same(){return same;}};
applySkin();
show('home');
})();
</script>

if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
